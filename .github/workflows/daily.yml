name: 毎日の情報収集・AI分析・PR作成

on:
  schedule:
    # 毎日 JST 8:00 (UTC 23:00) に実行
    - cron: "0 23 * * *"
  workflow_dispatch:
    # 手動実行も可能

jobs:
  collect-analyze-propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r scripts/requirements.txt


      - name: 情報収集（collect.py）
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/collect.py

      - name: AI分析・Markdown更新（analyze.py）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze.py

      - name: Pull Request 作成（create_pr.py）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/create_pr.py

      - name: Discordに通知を送信
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          STATUS="⚠️ 処理完了（ステータス不明）"
          COLOR=16776960
          DESCRIPTION="処理が完了しましたが、明示的な結果ファイルが出力されませんでした。"

          if [ -f /tmp/error_info.json ]; then
            STATUS="❌ AI・処理エラー"
            COLOR=16711680
            ERR_MSG=$(jq -r '.error' /tmp/error_info.json)
            DESCRIPTION="処理中にエラーが発生しました。\n\n**エラー詳細:**\n$ERR_MSG"
          elif [ -f /tmp/no_changes ]; then
            STATUS="✅ 更新なし"
            COLOR=3092790
            DESCRIPTION="新しい情報は見つかりませんでした。"
          elif [ -f /tmp/pr_info.json ]; then
            STATUS="新しい情報更新案が届いています"
            COLOR=16766720
            PR_TITLE=$(jq -r '.title' /tmp/pr_info.json)
            PR_URL=$(jq -r '.url' /tmp/pr_info.json)
            DESCRIPTION="情報更新の提案が作成されました。\n\n**内容:**\n[$PR_TITLE]($PR_URL)\n\nGitHub上で確認し、マージまたはクローズを行ってください。"
          elif [ -f /tmp/analysis_results.json ]; then
            STATUS="新しい情報更新案が届いています"
            COLOR=16766720
            DESCRIPTION="Pull Request を確認して承認や保留を行ってください。"
          fi

          DATE=$(date '+%Y年%m月%d日 %H:%M UTC')
          REPO_URL="https://github.com/${{ github.repository }}"
          PR_LINK="[${{ github.repository }}](${REPO_URL}/pulls)"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg desc "$DESCRIPTION" \
            --arg date "$DATE" \
            --arg pr_link "$PR_LINK" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ("論点の現在地 — " + $status),
                description: $desc,
                color: $color,
                fields: [
                  { name: "実行日時", value: $date, inline: true },
                  { name: "Pull Requests", value: $pr_link, inline: true }
                ],
                footer: { text: "論点の現在地 Bot" }
              }]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"


