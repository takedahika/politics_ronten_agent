name: 新規論点の自動提案（Substack解析）

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "解析するSubstackの記事URL（空欄の場合は本文を使用）"
        required: false
        default: ""
      article_content:
        description: "GAS経由で渡されるエッセイ本文"
        required: false
        default: ""
      article_title:
        description: "GAS経由で渡されるエッセイタイトル"
        required: false
        default: ""
      article_original_url:
        description: "GAS経由で渡されるエッセイのオリジナルURL"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-new-topics:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r scripts/requirements.txt

      - name: Substackエッセイからの新規トピック提案（propose_topics.py）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          ARTICLE_CONTENT: ${{ github.event.inputs.article_content }}
          ARTICLE_TITLE: ${{ github.event.inputs.article_title }}
          ARTICLE_ORIGINAL_URL: ${{ github.event.inputs.article_original_url }}
        run: python scripts/propose_topics.py

      - name: Discordに通知を送信
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="✅ 新規提案なし"
          COLOR=3092790
          DESCRIPTION="最新エッセイから、新しい論点の提案はありませんでした（すでに追跡中、または該当なし）。"

          if [ -f /tmp/error_info.json ]; then
            STATUS="❌ AI・処理エラー"
            COLOR=16711680
            ERR_MSG=$(jq -r '.error' /tmp/error_info.json)
            DESCRIPTION="処理中にエラーが発生しました。\n\n**エラー詳細:**\n$ERR_MSG"
          elif [ -f /tmp/pr_info.json ]; then
            STATUS="💡 新しい論点が提案されました"
            COLOR=16766720
            PR_TITLE=$(jq -r '.title' /tmp/pr_info.json)
            PR_URL=$(jq -r '.url' /tmp/pr_info.json)
            DESCRIPTION="あなたのSubstack最新記事から、新しい論点（トピック）の候補を検出しました！\n\n**提案内容:**\n[$PR_TITLE]($PR_URL)\n\nこの論点の追跡を開始する場合は、GitHub上でマージ（承認）を行ってください。"
          fi

          DATE=$(date '+%Y年%m月%d日 %H:%M UTC')

          # jq を使って安全にエスケープされた JSON を生成
          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg desc "$DESCRIPTION" \
            --arg date "$DATE" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ("論点の現在地 — " + $status),
                description: $desc,
                color: $color,
                fields: [
                  { name: "実行環境", value: "GitHub Actions (propose_topics.yml)", inline: true },
                  { name: "実行日時", value: $date, inline: true }
                ],
                footer: { text: "論点の現在地 Bot" }
              }]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

