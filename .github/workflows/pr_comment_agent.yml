name: AI PR Comment Agent

on:
  issue_comment:
    types: [created]

jobs:
  pr_comment_agent:
    name: Run AI Editor
    # PRに対するコメントであり、かつコメント本文に @ronten-ai が含まれている場合のみ実行
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@ronten-ai') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get PR details
        id: pr_details
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return pr.data.head.ref;
          result-encoding: string

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_details.outputs.result }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run AI PR Comment Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          python scripts/pr_comment_agent.py
