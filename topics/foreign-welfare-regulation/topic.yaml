id: foreign-welfare-regulation
title: 外国人に対する生活保護の運用適正化と実態把握
slug: foreign-welfare-regulation
description: 政府が2026年1月に決定した「外国人の受入れ・秩序ある共生のための総合的対応策」に基づき、マイナンバーを活用して外国人受給者の在留資格や国籍を把握する「生活保護制度の運用の適正化」が進められている。これに対し、人道的な観点から行政措置として行われてきた外国人への生活保護を不当に制限・厳格化するものだとして、弁護士団体や支援組織から強い反対の声が上がっている。
