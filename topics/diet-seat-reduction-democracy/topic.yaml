id: diet-seat-reduction-democracy
title: 議員定数削減と選挙制度変更による民主主義への影響
slug: diet-seat-reduction-democracy
description: 2026年、自民党と日本維新の会は衆院議員定数の1割（45議席）を削減する法案を国会に提出した。特に、1年以内に結論が出ない場合は比例代表のみを45議席削減する内容となっており、これに対し野党や法曹界からは「大政党に有利な制度変更であり、少数意見の切り捨てや多様な民意の反映を阻害し、民主主義を後退させる」との強い批判が上がっている。財政削減や「身を切る改革」を掲げる与党側の主張と、民主主義の危機を訴える野党側の主張が対立している。
