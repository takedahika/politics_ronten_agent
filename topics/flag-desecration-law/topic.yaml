id: flag-desecration-law
title: 国旗損壊罪の創設と表現の自由をめぐる議論
slug: flag-desecration-law
description: 2026年7月に成立した「国旗の損壊等の処罰に関する法律（国旗損壊罪）」をめぐる議論。自民党、日本維新の会、国民民主党、参政党の4党が共同提案した議員立法であり、外国国章損壊罪との均衡や「国旗を大切に思う国民感情」の保護を目的とする。一方で、野党（立憲民主党や共産党など）や日本弁護士連合会、人権団体からは、憲法が保障する「表現の自由」や「思想・良心の自由」を侵害する懸念や、処罰基準の曖昧さによる罪刑法定主義違反、政治的抗議活動の萎縮を招くとの批判がなされ、激しい対立が生じている。
